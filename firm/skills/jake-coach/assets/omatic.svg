<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">o-MATIC Robot Badge</title>
  <desc id="desc">Square badge of the o-MATIC robot mascot: the grin expression head with its cream eyes, gold ear cups, gold-ball antenna and neck joint, on a dark teal rounded-rectangle plate with a black border.</desc>

  <!-- PROVENANCE. This mark is a CROP, not a drawing, and not a re-weighting.
       Geometry: group #sample-head-happy, verbatim, from
         brand/omatic-robot-vector-no-bg.svg  (asset.mascot.vector.svg, tier 2)
       cross-checked 2026-09-12 by native render of
         ART/o-matic/master/omatic-robot-samples-vector-affinity.af
         (identity.master.mascot_samples, tier 3)
       opened with `open -a Affinity` and rendered via render_spread. Document.load()
       was NOT used - it renders dark with a purple cast (known SDK defect).
       Mandated by identity.mascot.derivation_rule: "A HEAD CROP ALREADY EXISTS IN
       THE FAMILY ... every badge, favicon, avatar and square mark is a crop or
       variant of those heads. It never needs drawing from scratch."
       Of the three expression heads the GRIN is the badge default per
       identity.mascot.expressions.grin; wink is situational and thumbs-up carries a
       hand plus motion sparks that cannot survive a 16px slot.

       LINE WEIGHT IS THE MASTER'S, UNTOUCHED. outline-lg 10, outline 8,
       outline-sm 6, shine 7, gold-line 8 - the master's own values, and the 10/8/6
       spread is the mascot's weight variation, which is a large part of why it reads
       hand-drawn. The stroke scales with the crop, so it stays the same percentage of
       head width as in the master (outline-lg = 2.1%). An earlier draft thickened
       these 2.0-2.5x to "help" the 16px slot and inflated the eye radii with them;
       the operator rejected it as too heavy and was right - a uniformly thickened
       outline is a redraw of the mascot's line language, which brand_messaging #41
       (preserve silhouette, face, eyes, teal body, gold accents, personality) and #78
       (evolution over replacement) both forbid. Radii, pupils and speculars are
       likewise the master's exact values.

       PALETTE. The robot keeps the mascot's OWN palette, per identity.mascot.shape
       (tier 3): "Large CREAM/off-white eyes (not pure white)". Those hexes are not in
       the five color.* tokens, so scripts/brand_lint.py reports them as [P]. That is
       EXPECTED here: the governed master itself (a tier-2 asset token) carries the
       same 13 [P] findings, as do all three theme mascot derivatives - the palette
       check was never scoped to mascot artwork. Recoloring the robot into the 5-token
       UI palette is what produced the rejected draft that "shared nothing with the
       mascot but the colors". NOTE every teal in the mascot's gradient and its
       shading is OFF-TOKEN against color.primary; that is the exact divergence
       decision #506 ruling 1 orders re-cut. It is inherited here deliberately and NOT
       corrected locally, because recoloring would fork this badge from its own master
       and re-open the fidelity failure. Those values are deliberately NOT spelled out
       in this comment: brand_lint scans comment text as well as paint, so quoting an
       off-token hex here makes the file report a violation it does not render.

       PLATE. type.wordmark_badge (tier 3) says "dark teal rounded rectangle, black
       border" and no governed hex exists for "dark teal" - the open finding in
       decision #512. Resolved by MEASURED PRECEDENT: the existing governed badge,
       brand/omatic-wordmark-teletype-affinity.svg (asset.wordmark.badge.svg, tier 2),
       already implements this plate as a "dark teal hardware-panel backing" - a
       two-stop dark teal gradient with a near-black border. Reused verbatim, so the robot
       badge and the wordmark badge are the same plate. The mascot's own teal-dark
       teal-dark was tried first and FAILED on inspection: it is the robot body's
       shading color, so the head merged into the plate, which also violates
       identity.visual_style ("dark backgrounds, strong contrast"). Border weight is
       ungoverned; 5 on the 96 grid with inset 2.5 and rx 11.5 lands an outer radius
       of exactly 14, matching the theme's small-mark siblings
       (o-matic-icon-connect.svg).

       SIZE. Slots measured in website/themes/o-matic-ai/style.css: 24px desktop,
       20px at max-width 781px, plus a 16px favicon. The head is 80 of the 96 units
       wide, leaving 3 units of plate clear on every side. Wider was tried and
       rejected by inspection: at 86 the gold ear cups collide with the black border
       and that reads WORSE at 16px, because ear and frame merge into one dark mass. -->
  <defs>
    <radialGradient id="tealGloss" cx="28%" cy="18%" r="88%">
      <stop offset="0" stop-color="#0aa1aa"/>
      <stop offset="0.55" stop-color="#087f88"/>
      <stop offset="1" stop-color="#045c64"/>
    </radialGradient>
    <radialGradient id="goldGloss" cx="30%" cy="20%" r="82%">
      <stop offset="0" stop-color="#ffe477"/>
      <stop offset="0.52" stop-color="#ffc928"/>
      <stop offset="1" stop-color="#e4a900"/>
    </radialGradient>

    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#083f45"/>
      <stop offset="1" stop-color="#021b20"/>
    </linearGradient>
<style>
      .teal{fill:url(#tealGloss)}
      .teal-dark{fill:#064f55}
      .gold{fill:url(#goldGloss)}
      .gold-flat{fill:#ffc928}
      .cream{fill:#fff2cb}
      .black{fill:#050606}
      .joint{fill:#1f3030}
      .none{fill:none}
      .spec{fill:#fff5d5}
      .shine{fill:none;stroke:#fff5d5;stroke-width:7;stroke-linecap:round}
      .gold-line{fill:none;stroke:#ffc928;stroke-width:8;stroke-linecap:round}
      .ink,.ink-lg,.ink-sm{stroke:#050606;stroke-linecap:round;stroke-linejoin:round}
      .ink-lg{stroke-width:10}
      .ink{stroke-width:8}
      .ink-sm{stroke-width:6}
    </style>
  </defs>

  

  <g transform="translate(8.000 22.853) scale(0.16807)">
    <path class="teal-dark ink" d="M42 171c-40 6-52 62-18 87 11 8 25 10 40 5"/>
    <path id="shell" class="teal ink-lg" d="M65 89c33-36 322-40 363-6 26 22 27 154 5 178-38 42-324 38-369 5-25-18-24-150 1-177z"/>
    <path class="none ink-sm" d="M118 138c52-30 196-41 276-26"/>
    <circle id="eyeL" class="cream ink" cx="175" cy="181" r="49"/>
    <circle id="eyeR" class="cream ink" cx="318" cy="173" r="45"/>
    <circle class="black" cx="177" cy="179" r="25"/>
    <circle class="black" cx="318" cy="172" r="23"/>
    <circle class="spec" cx="185" cy="166" r="9"/>
    <circle class="spec" cx="326" cy="160" r="8"/>
    <path id="grin" class="black ink-sm" d="M209 231c34 26 76 18 102-12 5 43-72 69-102 12z"/>
    <ellipse class="teal ink" cx="36" cy="183" rx="32" ry="55"/>
    <ellipse class="gold ink" cx="30" cy="185" rx="20" ry="45"/>
    <path class="none ink-sm" d="M23 185l-15 2"/>
    <ellipse id="earR" class="teal ink" cx="452" cy="175" rx="20" ry="43"/>
    <path class="gold ink" d="M439 135c15 8 22 23 21 42 0 21-8 38-22 45z"/>
    <path id="neck" class="joint ink" d="M209 276h84v38c-21 11-63 11-84 0z"/>
    <path class="teal-dark ink-sm" d="M238 74l-13-72 19-3 14 71z"/>
    <circle id="ball" class="gold ink" cx="234" cy="1" r="24"/>
    <path class="gold ink" d="M213 72c18-12 51-11 66 3l3 27-73 4z"/>
    <path class="gold-line" d="M101 131l8-6"/>
    <circle class="gold-flat" cx="92" cy="147" r="7"/>
    <circle class="gold-flat" cx="88" cy="169" r="7"/>
    <path class="shine" d="M326 99c23 1 42 5 52 13"/>
  </g>
</svg>
