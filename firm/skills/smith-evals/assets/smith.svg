      <circle fill="url(#gold)" stroke="#050606" stroke-width="8" cx="456" cy="78" r="16"/>
      <circle fill="url(#gold)" stroke="#050606" stroke-width="8" cx="574" cy="78" r="16"/>
      <path fill="url(#gold)" stroke="#050606" stroke-width="9" stroke-linejoin="round" d="M470 179c28-18 73-18 101 0l7 42H463z"/>
    </g>

    <g id="head">
