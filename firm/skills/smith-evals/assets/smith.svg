      <path fill="url(#teal)" stroke="#050606" stroke-width="9" d="M404 880c56-22 101-2 120 52-57 18-133 16-181 0 10-23 30-41 61-52z"/>
      <path fill="url(#teal)" stroke="#050606" stroke-width="9" d="M620 880c-56-22-101-2-120 52 57 18 133 16 181 0-10-23-30-41-61-52z"/>
      <path fill="none" stroke="#fff5d5" stroke-width="7" stroke-linecap="round" d="M390 908c18-9 35-12 50-10"/>
      <path fill="none" stroke="#fff5d5" stroke-width="7" stroke-linecap="round" d="M584 900c18 2 34 8 48 18"/>
    </g>
  </g>
</svg>
