      <path fill="url(#teal)" stroke="#050606" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" d="M364 548c54-38 240-40 300-1 43 28 48 189 9 225-55 52-268 53-324 0-37-35-30-194 15-224z"/>
