<svg viewBox="58 58 907 907" version="1.1" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Smith O-Matic Robot Vector</title>
  <desc id="desc">Affinity-safe roster vector of Smith, O-Matic critical analyst, using the new robot model with adversarial review marks, warning cues, crossed arms, and inspector coat. Task #751 (2026-09-28, Monet): chest O-ring restored from the registered master brand/omatic-robot-vector-no-bg.svg (sha256 837fbc0156a023ec) at its own geometry, gold r66 + teal r35 at 510,658; palette rebound to the master's gradients per decision #522; the role instrument moved off the chest per brand_messaging #120; no red on the robot (color.alert).</desc>
  <defs>
    <radialGradient id="teal" cx="28%" cy="18%" r="88%">
      <stop offset="0" stop-color="#0aa1aa"/>
      <stop offset="0.55" stop-color="#087f88"/>
      <stop offset="1" stop-color="#045c64"/>
    </radialGradient>
    <radialGradient id="gold" cx="30%" cy="20%" r="82%">
      <stop offset="0" stop-color="#ffe477"/>
      <stop offset="0.52" stop-color="#ffc928"/>
      <stop offset="1" stop-color="#e4a900"/>
    </radialGradient>
    <radialGradient id="red" cx="32%" cy="22%" r="82%">
      <stop offset="0" stop-color="#4b5658"/>
      <stop offset=".58" stop-color="#2b2d2f"/>
      <stop offset="1" stop-color="#1a1a1a"/>
    </radialGradient>
    <radialGradient id="coat" cx="30%" cy="18%" r="86%">
      <stop offset="0" stop-color="#9e9276"/>
      <stop offset=".58" stop-color="#6f6653"/>
      <stop offset="1" stop-color="#3d392f"/>
    </radialGradient>
    <radialGradient id="cream" cx="30%" cy="20%" r="86%">
      <stop offset="0" stop-color="#fff2cb"/>
      <stop offset="1" stop-color="#fff2cb"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" fill="none"/>

