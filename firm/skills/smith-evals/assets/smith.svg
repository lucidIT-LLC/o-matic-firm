        <circle fill="url(#gold)" stroke="#050606" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" cx="510" cy="658" r="66"/>
        <circle fill="url(#teal)" stroke="#050606" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" cx="510" cy="658" r="35"/>
      </g>
    </g>

    <g id="smith-role-badge" transform="translate(398 606) scale(0.42) translate(-512 -658)">
      <!-- #751 / brand_messaging #120: the role instrument that used to replace the O-ring,
           relocated here unchanged in shape. -->
      <path fill="#0d626a" stroke="#050606" stroke-width="8" d="M477 610h70v96h-70z"/>
      <path fill="none" stroke="#7fd0c9" stroke-width="6" stroke-linecap="round" d="M494 642h36M494 668h36"/>
    </g>

    <g id="crossed-arms">
      <path fill="#1f3030" stroke="#050606" stroke-width="9" stroke-linejoin="round" d="M324 608l91 72-52 59-102-80z"/>
      <path fill="#1f3030" stroke="#050606" stroke-width="9" stroke-linejoin="round" d="M701 608l-91 72 52 59 102-80z"/>
