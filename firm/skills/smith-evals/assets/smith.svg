      <path fill="#064f55" stroke="#050606" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity=".72" d="M327 304c59-47 301-55 373-22 34 16 44 45 43 82-1 49-22 87-67 104-76 29-260 27-321-6-43-23-58-116-28-158z"/>
      <circle fill="url(#cream)" stroke="#050606" stroke-width="10" cx="435" cy="351" r="56"/>
      <circle fill="url(#cream)" stroke="#050606" stroke-width="10" cx="587" cy="351" r="56"/>
      <circle fill="#050606" cx="435" cy="351" r="18"/>
      <circle fill="#050606" cx="587" cy="351" r="18"/>
      <path fill="none" stroke="#050606" stroke-width="8" stroke-linecap="round" d="M472 428h82"/>
      <path fill="none" stroke="#050606" stroke-width="6" stroke-linecap="round" d="M491 207l-16 18M475 207l16 18"/>
      <path fill="none" stroke="#050606" stroke-width="6" stroke-linecap="round" d="M395 282h68M558 282h68"/>
      <path fill="none" stroke="#fff5d5" stroke-width="8" stroke-linecap="round" d="M361 256h116"/>
    </g>

    <g id="ears">
      <rect fill="#4b5658" stroke="#050606" stroke-width="9" x="246" y="328" width="44" height="78" rx="18"/>
      <rect fill="#4b5658" stroke="#050606" stroke-width="9" x="734" y="328" width="44" height="78" rx="18"/>
    </g>

    <g id="neck-body">
